name: Check migration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Install pnpm
        run: npm install --global pnpm@latest
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
