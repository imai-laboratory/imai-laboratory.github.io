name: Build preview artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build-preview:
    name: Build reviewable preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload preview artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.event.pull_request.number || github.run_number }}
          path: dist
          retention-days: 7

      - name: Comment preview URL on pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = "<!-- preview-artifact -->";
            const body = [
              marker,
              "## Preview artifact",
              "",
              `確認用の成果物を作成しました: [distをダウンロード](${process.env.PREVIEW_URL})`,
              "",
              "この成果物は7日後に自動削除されます。本番のGitHub Pagesにはデプロイしていません。",
            ].join("\\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
